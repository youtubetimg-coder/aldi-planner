name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: |
          mkdir -p /tmp/sbcli
          curl -sL "https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz" -o /tmp/sbcli/supabase.tar.gz
          tar -xzf /tmp/sbcli/supabase.tar.gz -C /tmp/sbcli
          chmod +x /tmp/sbcli/supabase
          sudo mv -f /tmp/sbcli/supabase /usr/local/bin/
          supabase --version

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply database schema
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
            "host=aws-0-ap-northeast-2.pooler.supabase.com port=6543 dbname=postgres user=postgres.$SUPABASE_PROJECT_REF sslmode=require" \
            -v ON_ERROR_STOP=1 -f supabase/schema.sql -f supabase/byok.sql

      - name: Deploy Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase functions deploy process-calendar --project-ref "$SUPABASE_PROJECT_REF"
